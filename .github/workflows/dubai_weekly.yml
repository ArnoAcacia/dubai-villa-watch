# .github/workflows/dubai_weekly.yml
# Dubai Villa Watch — Rapport dominical automatique
# Chaque dimanche à 08h00 heure de Dubaï (UTC+4) = 04h00 UTC

name: Dubai Villa Watch — Rapport Dominical

on:
  schedule:
    - cron: '0 4 * * 0'      # Dimanche 04h00 UTC = 08h00 Dubaï
  workflow_dispatch:           # Bouton "Run workflow" manuel dans GitHub
    inputs:
      dry_run:
        description: 'Dry-run : génère email HTML sans envoyer (true/false)'
        required: false
        default: 'false'
        type: boolean

# Permissions minimales
permissions:
  contents: read

jobs:
  weekly-report:
    name: Génération & Envoi rapport
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ── 1. Récupérer le code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 3.12 ───────────────────────────────────────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. Cache pip ──────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('dubai_agent/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # ── 4. Installer les dépendances ──────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install -r dubai_agent/requirements.txt
          playwright install chromium --with-deps

      # ── 5. Restaurer la base SQLite du run précédent ──────────────────────
      - name: Restore database
        uses: actions/cache@v4
        with:
          path: dubai_agent/dubai_realestate.db
          key:  db-${{ github.run_id }}
          restore-keys: db-

      # ── 6. Créer les dossiers nécessaires ─────────────────────────────────
      - name: Prepare folders
        run: mkdir -p dubai_agent/reports dubai_agent/logs

      # ── 7. Lancer le pipeline ─────────────────────────────────────────────
      - name: Run pipeline
        working-directory: dubai_agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAPIDAPI_KEY:      ${{ secrets.RAPIDAPI_KEY }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL:          ${{ secrets.TO_EMAIL }}
          DASHBOARD_URL:     ${{ secrets.DASHBOARD_URL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "=== Mode dry-run ==="
            python main.py --dry-run
          else
            echo "=== Mode production ==="
            python main.py
          fi

      # ── 8. Sauvegarder les fichiers générés ───────────────────────────────
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-dubai-${{ github.run_id }}
          path: dubai_agent/reports/
          if-no-files-found: ignore
          retention-days: 90

      # ── 9. Sauvegarder la base de données ─────────────────────────────────
      - name: Save database
        if: always()
        uses: actions/cache@v4
        with:
          path: dubai_agent/dubai_realestate.db
          key: db-${{ github.run_id }}
